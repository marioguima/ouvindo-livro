[project]
name = "ouvindo-livro"
version = "0.1.0"
description = "Pipeline simples para transformar livros em texto limpo, estudo inteligente e audio por capitulo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ebooklib>=0.18",
    "pydantic>=2.8.2",
    "pymupdf>=1.24.9",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[project.scripts]
ouvindo-livro = "ouvindo_livro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
